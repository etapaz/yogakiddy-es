<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MHVSBZV" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <yk-header></yk-header>

    <main>
        <section class="section">
            <div class="container">
                <div class="flex-row">
                    <!-- Left: Info -->
                    <div class="reveal">
                        <span class="pill-badge">Contacto</span>
                        <h1 class="mb-4">¡Hablemos!</h1>
                        <p class="text-large mb-6">Estamos aquí para responder tus dudas y acompañarte en este camino
                            hacia el bienestar infantil.</p>

                        <ul class="feature-list">
                            <li>
                                <span class="icon">&#9993;&#65039;</span>
                                <span><strong>Email:</strong> info@yogakiddy.com</span>
                            </li>
                            <li>
                                <span class="icon">&#128205;</span>
                                <span><strong>Ubicaciones:</strong> Santiago &middot; Bruselas</span>
                            </li>
                            <li>
                                <span class="icon">&#128241;</span>
                                <span><strong>WhatsApp:</strong> +56 9 5479 7227</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Right: Form -->
                    <div class="reveal reveal-delay-2">
                        <div class="section-panel" style="margin: 0;">
                            <form id="contact-form">
                                <input type="hidden" name="access_key" value="592531b3-657e-4489-863e-ba00ff105f8b">
                                <input type="hidden" name="subject" value="Nuevo mensaje desde YogaKiddy">
                                <div class="form-group">
                                    <label for="name" class="form-label">Nombre</label>
                                    <input type="text" id="name" name="name" required class="form-input"
                                        placeholder="Tu nombre">
                                </div>
                                <div class="form-group">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <input type="email" id="email" name="email" required class="form-input"
                                        placeholder="tu@email.com">
                                </div>
                                <div class="form-group">
                                    <label for="message" class="form-label">Mensaje</label>
                                    <textarea id="message" name="message" required class="form-textarea"
                                        placeholder="¿En qué podemos ayudarte?"></textarea>
                                </div>
                                <div id="form-result" style="margin-bottom: 1rem; text-align: center; display: none;"></div>
                                <button type="submit" class="btn btn--rose" style="width: 100%;">Enviar mensaje</button>
                            </form>
                        </div>
                        <script>
                            document.getElementById('contact-form').addEventListener('submit', function(e) {
                                e.preventDefault();
                                const form = e.target;
                                const result = document.getElementById('form-result');
                                const submitBtn = form.querySelector('button[type="submit"]');
                                
                                submitBtn.disabled = true;
                                submitBtn.textContent = 'Enviando...';
                                
                                const formData = new FormData(form);
                                
                                fetch('https://api.web3forms.com/submit', {
                                    method: 'POST',
                                    body: formData
                                })
                                .then(async (response) => {
                                    let json = await response.json();
                                    if (response.status == 200) {
                                        window.location.href = 'gracias.html';
                                    } else {
                                        result.innerHTML = "Algo salió mal. Por favor, intenta nuevamente.";
                                        result.style.color = "#dc2626";
                                        result.style.display = "block";
                                        submitBtn.disabled = false;
                                        submitBtn.textContent = 'Enviar mensaje';
                                    }
                                })
                                .catch((error) => {
                                    result.innerHTML = "Error de conexión. Por favor, verifica tu conexión a internet.";
                                    result.style.color = "#dc2626";
                                    result.style.display = "block";
                                    submitBtn.disabled = false;
                                    submitBtn.textContent = 'Enviar mensaje';
                                });
                            });
                        </script>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <yk-footer></yk-footer>
    <button class="back-to-top" aria-label="Volver arriba">&#8593;</button>
</body>

</html>
