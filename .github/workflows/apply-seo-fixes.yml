name: Apply SEO fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify base and apply fixes
        shell: bash
        run: |
          set -euo pipefail
          expected=b2f5f5f3ba1855832fb4ab939c8f312a6ec64fde
          # The temporary workflow may have been committed or corrected more than once.
          # Accept that history only when every change since the audited base is this workflow.
          git merge-base --is-ancestor "$expected" HEAD || { echo "audited base is not an ancestor"; exit 1; }
          unexpected=$(git diff --name-only "$expected"..HEAD -- . ':(exclude).github/workflows/apply-seo-fixes.yml')
          test -z "$unexpected" || { echo "main contains unrelated changes since audited base:"; printf '%s\n' "$unexpected"; exit 1; }
          python3 <<'PY'
          from pathlib import Path
          from html import escape
          import re

          # Build one redirect map from the repo's existing redirect sources.
          rules={}
          for line in Path('_redirects').read_text().splitlines():
              p=line.strip().split()
              if len(p)==3 and '*' not in p[0]: rules[p[0].rstrip('/')]=p[1]
          t=Path('netlify.toml').read_text()
          for b in re.findall(r'\[\[redirects\]\](.*?)(?=\n\[\[|\Z)',t,flags=re.S):
              fm=re.search(r'^\s*from\s*=\s*"([^"]+)"',b,flags=re.M)
              to=re.search(r'^\s*to\s*=\s*"([^"]+)"',b,flags=re.M)
              if fm and to and '*' not in fm.group(1): rules.setdefault(fm.group(1).rstrip('/'),to.group(1))

          # Remove dead sitemap entries and duplicate contact structurally.
          # XML parsing avoids regex crossing adjacent <url> blocks in Actions.
          import xml.etree.ElementTree as ET
          p=Path('sitemap.xml')
          tree=ET.parse(p); root=tree.getroot()
          ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          remove={
              'https://yogakiddy.com/services/family-yoga.html',
              'https://yogakiddy.com/services/kids-yoga.html',
              'https://yogakiddy.com/formacion-sonoterapia-infantil-en-linea',
          }
          seen=set(); removed=set(); duplicate_contact=0
          for entry in list(root):
              loc=entry.find(ns+'loc')
              if loc is None: continue
              url=(loc.text or '').strip()
              if url in remove:
                  root.remove(entry); removed.add(url); continue
              if url in seen:
                  assert url=='https://yogakiddy.com/contact.html',url
                  root.remove(entry); duplicate_contact += 1; continue
              seen.add(url)
          assert removed==remove,(removed,remove)
          final_urls=[((e.find(ns+'loc').text or '').strip()) for e in list(root) if e.find(ns+'loc') is not None]
          assert final_urls.count('https://yogakiddy.com/contact.html')==1,final_urls.count('https://yogakiddy.com/contact.html')
          assert len(final_urls)==len(set(final_urls)),(len(final_urls),len(set(final_urls)))
          ET.indent(tree,space='  ')
          tree.write(p,encoding='utf-8',xml_declaration=True)

          # Point internal links straight at final canonical destinations.
          for f in Path('.').rglob('*.html'):
              if '.git' in f.parts or 'seo_migration_output' in f.parts or not f.is_file(): continue
              s=f.read_text(errors='ignore'); old=s
              for src,dst in sorted(rules.items(),key=lambda x:-len(x[0])):
                  for v in ['https://yogakiddy.com'+src+'/', 'https://yogakiddy.com'+src, src+'/']:
                      s=s.replace('href="'+v+'"','href="'+dst+'"').replace("href='"+v+"'","href='"+dst+"'")
                  s=s.replace('href="'+src+'"','href="'+dst+'"').replace("href='"+src+"'","href='"+dst+"'")
              if s!=old: f.write_text(s)

          # Materialize GitHub Pages-compatible redirect pages.
          for src,dst in rules.items():
              rel=src.strip('/')
              if not rel: continue
              direct=Path(rel)
              if direct.is_file() or Path(rel+'.html').is_file(): continue
              out=direct/'index.html'
              if out.exists(): continue
              out.parent.mkdir(parents=True,exist_ok=True)
              url='https://yogakiddy.com'+dst
              out.write_text(f'''<!doctype html>\n<html lang="es">\n<head>\n  <meta charset="utf-8">\n  <meta name="robots" content="noindex, follow">\n  <meta http-equiv="refresh" content="0; url={escape(dst,quote=True)}">\n  <link rel="canonical" href="{escape(url,quote=True)}">\n  <title>Redirigiendo...</title>\n  <script>window.location.replace({dst!r});</script>\n</head>\n<body>\n  <p>Redirigiendo a <a href="{escape(dst,quote=True)}">la página actual</a>...</p>\n</body>\n</html>\n''')

          # Four verified reciprocal ES/FR hreflang pairs, matching live FR (no x-default).
          pairs={
          'index.html':('https://yogakiddy.com/','https://fr.yogakiddy.com/'),
          'blog/como-hacer-que-la-postura-del-arbol-sea-divertida-para-los-ninos.html':('https://yogakiddy.com/blog/como-hacer-que-la-postura-del-arbol-sea-divertida-para-los-ninos.html','https://fr.yogakiddy.com/transforme-tes-enfants-en-arbres-comment-realiser-une-seance-complete-de-yoga-sur-la-posture-de-larbre'),
          'blog/yoga-infantil-la-respiracion-de-la-abeja-bhramari-pranayama.html':('https://yogakiddy.com/blog/yoga-infantil-la-respiracion-de-la-abeja-bhramari-pranayama.html','https://fr.yogakiddy.com/guide-yoga-enfants-respiration-abeille'),
          'blog/juegos-de-yoga-para-ninos.html':('https://yogakiddy.com/blog/juegos-de-yoga-para-ninos.html','https://fr.yogakiddy.com/jeux-de-yoga'),
          }
          for fn,(es,fr) in pairs.items():
              p=Path(fn); s=p.read_text()
              if 'hreflang="es"' in s: continue
              m=re.search(r'<link\s+rel="canonical"\s+href="'+re.escape(es)+r'"\s*/?>',s)
              assert m,fn
              c=m.group(0)
              s=s.replace(c,c+f'\n<link rel="alternate" hreflang="es" href="{es}">\n<link rel="alternate" hreflang="fr" href="{fr}">',1)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse,unquote
          import xml.etree.ElementTree as ET
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in ET.parse('sitemap.xml').getroot().findall('s:url/s:loc',ns)]
          assert len(urls)==245,(len(urls))
          assert len(set(urls))==245
          for u in urls:
              p=unquote(urlparse(u).path).lstrip('/')
              cs=[Path(p),Path(p+'.html'),Path(p)/'index.html'] if p else [Path('index.html')]
              assert any(c.is_file() for c in cs),u
          redirects=sum(1 for f in Path('.').rglob('*.html') if f.is_file() and 'seo_migration_output' not in f.parts and 'http-equiv="refresh"' in f.read_text(errors='ignore'))
          assert redirects==239,redirects
          PY
          git config user.name 'Instinct Agent'
          git config user.email 'agent@instinct.com'
          git add -A
          git commit -m 'fix(seo): repair indexing, redirects and hreflang'
          git push origin HEAD:main
